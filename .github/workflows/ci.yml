name: ci

on:
  pull_request:
  workflow_call:
    inputs:
      upload-site:
        description: Upload out/ so Pages can deploy the folder Chrome tested
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The suite used to be one sequential job (about 20 minutes, almost all of it
# eml:check). The jobs below run in parallel: eml:check is split into shards by
# EML_SHARD (see the top of lib/eml/check.ts and check-shards.json), and each
# golden mode runs in 4 shards by GOLDEN_SHARD. The check jobs print each block's time
# (EML_BLOCK_TIMES). check-shards.json holds cold times: each block alone in its own
# process (EML_ONLY_BLOCK), since a block's time in a shard depends on its shard-mates.
# The site job builds, runs headless Chrome, and uploads the folder it tested.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run eml:smoke

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eml:check
        env:
          EML_SHARD: ${{ matrix.shard }}/6
          EML_BLOCK_TIMES: "1"

  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: ["", "--wire"]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eml:golden -- ${{ matrix.mode }}
        env:
          GOLDEN_SHARD: ${{ matrix.shard }}/4

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PAGES_BASE_PATH: /eml-and-one
      - name: Headless Chrome regression
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || true)
          if [ -z "$CHROME" ]; then
            echo "google-chrome is not installed" >&2
            exit 1
          fi
          # The next step can reuse this name. The server on port 4173 is left running.
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          echo "SITE=http://127.0.0.1:4173/eml-and-one/" >> "$GITHUB_ENV"
          mkdir -p /tmp/eml-site
          ln -sfn "$PWD/out" /tmp/eml-site/eml-and-one
          # setsid keeps the server in its own session, so the next step can still use port 4173.
          setsid python3 -u -m http.server 4173 --directory /tmp/eml-site >/tmp/eml-site.log 2>&1 < /dev/null &
          for _ in $(seq 1 50); do
            curl -sf -o /dev/null http://127.0.0.1:4173/eml-and-one/ && break
            sleep 0.2
          done
          # 12 minutes is well past the 30 second in-page waits, and still ends a hung Chrome.
          SITE=http://127.0.0.1:4173/eml-and-one/ SITE_LOG=/tmp/eml-site.log CHROME="$CHROME" timeout --foreground 12m node scripts/site-check.mjs
      - name: Upload the tested site
        if: inputs.upload-site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-out
          path: out
          retention-days: 1
          if-no-files-found: error
