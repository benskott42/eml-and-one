name: Lean 4 Formal Proofs

on:
  push:
    branches: [main]
    paths:
      - "formal/lean/**"
      - "lib/eml/export.ts"
      - "lib/eml/best-known.json"
      - "lib/eml/leanCert.ts"
      - "scripts/lean-bridge-check.ts"
      - ".github/workflows/lean.yml"
  pull_request:
    paths:
      - "formal/lean/**"
      - "lib/eml/export.ts"
      - "lib/eml/best-known.json"
      - "lib/eml/leanCert.ts"
      - "scripts/lean-bridge-check.ts"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install elan & Lean 4
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Fetch Mathlib cache
        working-directory: formal/lean
        run: lake exe cache get
      - name: Build Lean 4 proofs
        working-directory: formal/lean
        run: lake build
      - name: Audit axioms (all Eml.* declarations)
        working-directory: formal/lean
        run: lake env lean AxiomCheck.lean
      - name: Setup Node.js for UI-Lean bridge check
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install JS dependencies
        run: npm ci --ignore-scripts
      - name: Cross-check UI theorem links, Cert.certify, and snippets in Lean 4
        run: npx tsx scripts/lean-bridge-check.ts
