name: Nightly engine fuzz

# Differential fuzzing of the exact engine against 2,500-digit mpmath
# (tools/fuzz/README.md). Every certified-wrong value found so far came from a
# sweep like this, so it runs every night on fresh seeds plus one fixed seed.
# fuzz.ts fails on an in-process vs worker-wire disagreement; oracle.py fails
# on a certified finite value that differs from mpmath by more than 1e-10.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: Expressions per seed
        required: false
        default: "1000"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        slot: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 -m pip install --user mpmath==1.3.0
      - name: Pick the seed
        id: seed
        run: |
          # Slot 0 is the fixed seed 1 (a regression baseline); the others are new every run.
          if [ "${{ matrix.slot }}" = "0" ]; then echo "seed=1" >> "$GITHUB_OUTPUT";
          else echo "seed=$(( ${{ github.run_number }} * 10 + ${{ matrix.slot }} ))" >> "$GITHUB_OUTPUT"; fi
      - name: Fuzz (in-process vs worker wire)
        run: npx tsx tools/fuzz/fuzz.ts --count "${{ github.event.inputs.count || '1000' }}" --seed "${{ steps.seed.outputs.seed }}" --json fuzz.json
      - name: Check certified values against mpmath
        run: python3 tools/fuzz/oracle.py fuzz.json
